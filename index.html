<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aizen — Workspace</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23D97757'><path d='M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z'/></svg>">
    
    <!-- External Libraries for PDF Parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar Navigation Drawer -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand">
                    <div class="brand-logo">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 3L14.8 9.2L21 10.2L16.5 15L17.8 21L12 17.8L6.2 21L7.5 15L3 10.2L9.2 9.2L12 3Z" fill="#D97757"/>
                        </svg>
                    </div>
                    <div class="brand-text">
                        <span class="brand-name">Aizen</span>
                        <span class="brand-tag">Workspace</span>
                    </div>
                </div>
                <button type="button" class="icon-btn close-sidebar-btn" id="closeSidebarBtn" title="Cerrar lateral" aria-label="Cerrar lateral">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
                </button>
            </div>

            <button type="button" class="new-chat-btn" id="newChatBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
                <span>Nueva conversación</span>
            </button>

            <div class="conversations-section">
                <div class="section-title">Conversaciones</div>
                <div class="conv-list" id="convList"></div>
            </div>

            <!-- Sidebar Controls: Theme -->
            <div class="sidebar-controls">
                <div class="sidebar-control-group">
                    <span class="control-label">Tema</span>
                    <div class="pill-segmented" id="themeSegment">
                        <button type="button" class="segment-btn" data-theme="light">☀ Claro</button>
                        <button type="button" class="segment-btn" data-theme="dark">☾ Oscuro</button>
                        <button type="button" class="segment-btn" data-theme="system">◐ Sistema</button>
                    </div>
                </div>
            </div>

            <div class="sidebar-footer">
                <button type="button" class="sidebar-btn" id="openApiKeyBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>
                    <span id="apiKeyStatusText">API Key de Claude</span>
                </button>
                <div class="creator-badge">
                    <span>Creado por Aizen</span>
                </div>
            </div>
        </aside>

        <!-- Sidebar Backdrop for Mobile -->
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

        <!-- Drag & Drop Overlay -->
        <div class="drag-drop-overlay hidden" id="dragDropOverlay">
            <div class="drag-drop-box">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#D97757" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                <span>Suelta los archivos para adjuntarlos</span>
            </div>
        </div>

        <!-- Main Workspace Area -->
        <main class="main-content">
            <!-- Header Topbar (Clean Header) -->
            <header class="topbar">
                <div class="topbar-left">
                    <button type="button" class="icon-btn mobile-menu-btn" id="openSidebarBtn" title="Menú" aria-label="Menú">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    </button>
                    <span class="topbar-brand-title">Aizen</span>
                </div>

                <div class="topbar-right">
                    <span id="activeChatTitle" class="chat-title-display">Nueva conversación</span>
                    
                    <!-- Desktop Actions -->
                    <div class="desktop-actions">
                        <button type="button" class="topbar-action-btn" id="clearChatBtn" title="Limpiar chat">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                            <span>Limpiar</span>
                        </button>
                    </div>

                    <!-- Mobile Overflow Menu Trigger -->
                    <div class="mobile-overflow-wrapper">
                        <button type="button" class="icon-btn" id="mobileMenuMoreBtn" title="Más opciones" aria-label="Más opciones">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/></svg>
                        </button>
                        <div class="mobile-overflow-menu hidden" id="mobileOverflowMenu">
                            <button type="button" class="menu-item-btn" id="mobileClearBtn">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                                <span>Limpiar Conversación</span>
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Chat Viewport -->
            <div class="chat-viewport" id="chatViewport">
                <!-- Welcome View -->
                <div class="welcome-container" id="welcomeContainer">
                    <div class="welcome-emblem">
                        <svg width="44" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" fill="#D97757"/>
                        </svg>
                    </div>
                    <h1 class="welcome-title">Bienvenido a Aizen</h1>
                    <p class="welcome-subtitle">¿En qué puedo ayudarte?</p>

                    <div class="starter-cards">
                        <button type="button" class="starter-card" data-prompt="Explica el concepto de recursividad y cómo funciona en JavaScript con ejemplos prácticos.">
                            <div class="card-icon">⚡</div>
                            <div class="card-text">
                                <strong>Explicar conceptos</strong>
                                <span>Recursividad en JavaScript</span>
                            </div>
                        </button>
                        <button type="button" class="starter-card" data-prompt="Escribe un script en Python para leer un archivo CSV, limpiar los datos y guardarlos en JSON.">
                            <div class="card-icon">💻</div>
                            <div class="card-text">
                                <strong>Escribir código</strong>
                                <span>Procesador de CSV en Python</span>
                            </div>
                        </button>
                        <button type="button" class="starter-card" data-prompt="Redacta una propuesta de proyecto estructurada en Markdown con objetivos, metodología y entregables.">
                            <div class="card-icon">📝</div>
                            <div class="card-text">
                                <strong>Redacción y síntesis</strong>
                                <span>Propuesta de proyecto en Markdown</span>
                            </div>
                        </button>
                    </div>
                </div>

                <!-- Messages Feed -->
                <div class="messages-feed" id="messagesFeed"></div>

                <!-- Floating Scroll To Bottom Button -->
                <button type="button" id="scrollToBottomBtn" class="scroll-to-bottom-btn hidden" title="Ir al final" aria-label="Ir al final">
                    <span>Ir al final ↓</span>
                </button>
            </div>

            <!-- Error Banner -->
            <div id="errorBanner" class="error-banner hidden">
                <div class="error-icon">⚠️</div>
                <div class="error-content">
                    <strong id="errorTitle">Error de API</strong>
                    <p id="errorMessage">Ha ocurrido un problema al procesar la solicitud.</p>
                </div>
                <button type="button" class="error-close" id="closeErrorBtn" aria-label="Cerrar error">&times;</button>
            </div>

            <!-- Floating Input Area / Compositor -->
            <div class="input-area-wrapper">
                <div class="input-card">
                    <div class="attachments-preview hidden" id="attachmentsPreview"></div>

                    <div class="input-row">
                        <textarea id="userInput" placeholder="Escribe un mensaje a Claude..." rows="2"></textarea>
                    </div>

                    <div class="input-toolbar">
                        <div class="toolbar-left">
                            <!-- Attach File Button: ONLY '+' icon -->
                            <input type="file" id="fileInput" multiple accept="image/png,image/jpeg,image/webp,image/gif,.pdf,.txt,.md,.json,.js,.py,.html,.css,.csv,.xml,.docx,.xlsx,.xls" hidden>
                            <button type="button" class="compositor-pill-btn attach-btn-plus" id="attachFileBtn" title="Adjuntar archivos" aria-label="Adjuntar archivos">+</button>

                            <!-- Model Selector Pill in Compositor -->
                            <div class="compositor-dropdown-wrapper">
                                <button type="button" class="compositor-pill-btn" id="modelPillBtn" aria-label="Seleccionar modelo">
                                    <span id="modelPillLabel" class="model-pill-label">Opus 5 Thinking</span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
                                </button>
                                <div class="compositor-menu hidden" id="modelMenu">
                                    <button type="button" class="compositor-menu-item active" data-model="nghi/claude-opus-5-thinking">Opus 5 Thinking</button>
                                    <button type="button" class="compositor-menu-item" data-model="nghi/claude-opus-5">Opus 5</button>
                                    <button type="button" class="compositor-menu-item" data-model="nghi/claude-opus-4.8-thinking">Opus 4.8 Thinking</button>
                                    <button type="button" class="compositor-menu-item" data-model="nghi/claude-opus-4.8">Opus 4.8</button>
                                    <button type="button" class="compositor-menu-item" data-model="nghi/claude-sonnet-5">Sonnet 5</button>
                                    <button type="button" class="compositor-menu-item" data-model="nghi/claude-haiku-4.5">Haiku 4.5</button>
                                </div>
                            </div>

                            <!-- Effort Selector Pill in Compositor -->
                            <div class="compositor-dropdown-wrapper" id="effortPillWrapper">
                                <button type="button" class="compositor-pill-btn" id="effortPillBtn" aria-label="Seleccionar nivel de esfuerzo">
                                    <span id="effortPillLabel">Alto</span>
                                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 15l-6-6-6 6"/></svg>
                                </button>
                                <div class="compositor-menu hidden" id="effortMenu">
                                    <button type="button" class="compositor-menu-item" data-effort="low">Bajo <span class="item-desc">más rápido y menor consumo</span></button>
                                    <button type="button" class="compositor-menu-item" data-effort="medium">Medio <span class="item-desc">equilibrio</span></button>
                                    <button type="button" class="compositor-menu-item active" data-effort="high">Alto <span class="item-desc">mejor razonamiento general</span></button>
                                    <button type="button" class="compositor-menu-item" data-effort="very_high">Muy alto <span class="item-desc">tareas complejas</span></button>
                                    <button type="button" class="compositor-menu-item" data-effort="maximum">Máximo <span class="item-desc">máxima capacidad</span></button>
                                </div>
                            </div>
                        </div>

                        <div class="toolbar-right">
                            <button type="button" class="send-btn" id="sendBtn" title="Enviar mensaje" aria-label="Enviar mensaje">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Simplified API Key Settings Modal -->
    <div class="modal-overlay hidden" id="apiKeyModal">
        <div class="modal-card">
            <div class="modal-header">
                <h3>API Key de Claude</h3>
                <button type="button" class="modal-close-btn" id="closeApiKeyModal" aria-label="Cerrar modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="apiKeyInput">Clave de API</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-..." autocomplete="off">
                </div>

                <div class="api-key-actions">
                    <button type="button" class="btn btn-secondary" id="testApiKeyBtn">Probar conexión</button>
                    <button type="button" class="btn btn-primary" id="saveApiKeyBtn">Guardar clave</button>
                    <button type="button" class="btn btn-danger" id="clearApiKeyBtn">Eliminar clave</button>
                </div>

                <div id="apiKeyNotice" class="modal-notice hidden"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
